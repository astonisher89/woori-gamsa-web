<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js" defer></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, getDocs, onSnapshot, updateDoc, deleteDoc, doc, query, where, orderBy
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import {
    getAuth, signInWithEmailAndPassword, signOut
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  // ⬇︎ Firebase 콘솔 > 프로젝트 설정 > 내 앱 > SDK 설정에서 복사한 값을 그대로 붙여넣어 주세요.
  const firebaseConfig = {
    apiKey: "AIzaSyB6Fr5Dsl7CqBJp_OTjwHn0PjXTnOh2DZ4",
    authDomain: "byw-newlywed-note.firebaseapp.com",
    projectId: "byw-newlywed-note",
    storageBucket: "byw-newlywed-note.firebasestorage.app",
    messagingSenderId: "130394814942",
    appId: "1:130394814942:web:4eccce5cc0e5f1a31b854f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  window.fb = {
    async addEntry(data){
      const ref = await addDoc(collection(db, 'entries'), data);
      return ref.id;
    },
    async listEntries(){
      const q = query(collection(db, 'entries'), orderBy('ts', 'asc'));
      const snap = await getDocs(q);
      return snap.docs.map(d => Object.assign({ _key: d.id }, d.data()));
    },
    subscribeEntries(callback){
      const q = query(collection(db, 'entries'), orderBy('ts', 'asc'));
      return onSnapshot(q, (snap)=>{
        callback(snap.docs.map(d => Object.assign({ _key: d.id }, d.data())));
      });
    },
    async findByEditCode(code){
      const q = query(collection(db, 'entries'), where('editCode', '==', code));
      const snap = await getDocs(q);
      return snap.docs.map(d => Object.assign({ _key: d.id }, d.data()));
    },
    async deleteEntry(id){
      await deleteDoc(doc(db, 'entries', id));
    },
    async updateEntry(id, data){
      await updateDoc(doc(db, 'entries', id), data);
    },
    async adminLogin(email, password){
      const cred = await signInWithEmailAndPassword(auth, email, password);
      return cred.user;
    },
    async adminLogout(){
      await signOut(auth);
    },
    isAdminSignedIn(){
      return !!auth.currentUser;
    }
  };
  window.dispatchEvent(new Event('fbready'));
</script>

</style>

<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
let entryCache = {}; // key -> entry data
let currentPhotoDataUrl = null;
const mySubmissions = new Set(); // 이번 세션에서 내가 올린 글의 key
let pollTimer = null;
let marqueeRaf = null;
let scriptureTimer = null;

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>t.classList.remove('show'), 2600);
}
function stopPoll(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }
function stopMarquee(){ if(marqueeRaf){ cancelAnimationFrame(marqueeRaf); marqueeRaf=null; } }
function stopScripture(){ if(scriptureTimer){ clearInterval(scriptureTimer); scriptureTimer=null; } }
let entriesUnsub = null;
function stopEntriesSub(){ if(entriesUnsub){ entriesUnsub(); entriesUnsub=null; } }

function dataUrlToBase64(dataUrl){
  const idx = dataUrl.indexOf(',');
  return idx >= 0 ? dataUrl.slice(idx + 1) : dataUrl;
}
function triggerDownload(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 4000);
}

async function fetchAllEntries(){

function openCropModal(file, onCropped){
  const reader = new FileReader();
  reader.onload = (e)=>{
    const overlay = document.createElement('div');
    overlay.className = 'crop-overlay';
    overlay.innerHTML = `
      <div class="crop-box">
        <h3>정사각형 틀 안에서 원하는 부분을 드래그·확대해보세요</h3>
        <div class="crop-img-wrap"><img id="cropImgEl" src="${e.target.result}"></div>
        <div class="btn-row" style="margin-top:16px;">
          <button class="btn btn-secondary" id="cropCancelBtn">취소</button>
          <button class="btn btn-primary" id="cropDoneBtn">이대로 사용하기</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const imgEl = overlay.querySelector('#cropImgEl');
    const cropper = new Cropper(imgEl, {
      aspectRatio: 1,
      viewMode: 1,
      background: false,
      autoCropArea: 1,
      dragMode: 'move'
    });
    function closeOverlay(){
      cropper.destroy();
      overlay.remove();
    }
    overlay.querySelector('#cropCancelBtn').addEventListener('click', closeOverlay);
    overlay.querySelector('#cropDoneBtn').addEventListener('click', ()=>{
      const canvas = cropper.getCroppedCanvas({ width: 1400, height: 1400 });
      const supportsWebp = canvas.toDataURL('image/webp', 0.5).indexOf('data:image/webp') === 0;
      const mime = supportsWebp ? 'image/webp' : 'image/jpeg';
      let quality = 0.9;
      let dataUrl = canvas.toDataURL(mime, quality);
      // Firestore 문서 1MB 한도 보호: 너무 크면 품질을 자동으로 낮춤
      while(dataUrl.length * 0.75 > 750 * 1024 && quality > 0.5){
        quality -= 0.1;
        dataUrl = canvas.toDataURL(mime, quality);
      }
      closeOverlay();
      onCropped(dataUrl);
    });
  };
  reader.readAsDataURL(file);
}

function compressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read fail'));
    reader.onload = e => {
      const img = new Image();
      img.onerror = () => reject(new Error('img fail'));
      img.onload = () => {
        const maxDim = 1000;
        let w = img.width, h = img.height;
        if(w >= h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if(h > w && h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight){
  const chars = text.split('');
  let line = '';
  let curY = y;
  for(let i=0;i<chars.length;i++){
    const test = line + chars[i];
    if(ctx.measureText(test).width > maxWidth && line){
      ctx.fillText(line, x, curY);
      line = chars[i];
      curY += lineHeight;
    } else { line = test; }
  }
  ctx.fillText(line, x, curY);
  return curY + lineHeight;
}

async function drawPersonalCard(entry){
  await document.fonts.ready;
  return new Promise((resolve)=>{
    const W = 900, H = 1300;
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#F6F1E7';
    ctx.fillRect(0,0,W,H);
    const img = new Image();
    img.onload = () => {
      const pad = 60;
      const photoSize = W - pad*2;
      const side = Math.min(img.width, img.height);
      const sx = (img.width - side)/2, sy = (img.height - side)/2;
      ctx.drawImage(img, sx, sy, side, side, pad, pad, photoSize, photoSize);
      ctx.strokeStyle = '#2C4A68';
      ctx.lineWidth = 3;
      ctx.strokeRect(pad, pad, photoSize, photoSize);

      ctx.fillStyle = '#2C4A68';
      ctx.font = '600 34px "Noto Serif KR", serif';
      ctx.textAlign = 'left';
      ctx.fillText('우리의 감사', pad, pad + photoSize + 56);

      ctx.fillStyle = '#2C4A68';
      ctx.fillRect(pad, pad + photoSize + 70, 48, 3);

      ctx.fillStyle = '#8C6A3F';
      ctx.font = '400 20px "Noto Sans KR", sans-serif';
      const dateLabel = new Date(entry.ts).toLocaleDateString('ko-KR', {year:'numeric',month:'long',day:'numeric'});
      ctx.fillText(dateLabel, pad, pad + photoSize + 100);

      ctx.fillStyle = '#2B2A25';
      ctx.font = '500 27px "Noto Sans KR", sans-serif';
      const nameLine = entry.district ? `${entry.coupleName} - ${entry.district}` : entry.coupleName;
      ctx.fillText(nameLine, pad, pad + photoSize + 142);

      ctx.font = '400 23px "Noto Sans KR", sans-serif';
      const msgEndY = wrapText(ctx, entry.message, pad, pad + photoSize + 182, W - pad*2, 33);

      ctx.fillStyle = 'rgba(43,42,37,0.4)';
      ctx.font = '400 15px "Noto Sans KR", sans-serif';
      ctx.fillText(EVENT_LABEL, pad, msgEndY + 14);

      resolve(canvas.toDataURL('image/png'));
    };
    img.src = entry.photo;
  });
}

  let rawPhotoFile = null;
  const fileDrop = root.querySelector('#fileDrop');
  const photoInput = root.querySelector('#photoInput');
  const recropBtn = root.querySelector('#recropBtn');
  fileDrop.addEventListener('click', ()=> photoInput.click());
  photoInput.addEventListener('change', ()=>{
    const file = photoInput.files[0];
    if(!file) return;
    rawPhotoFile = file;
    openCropModal(file, (dataUrl)=>{
      currentPhotoDataUrl = dataUrl;
      const preview = root.querySelector('#photoPreview');
      preview.src = dataUrl;
      preview.style.display = 'block';
      root.querySelector('#fileDropLabel').textContent = '다른 사진으로 바꾸기';
      recropBtn.style.display = 'inline';
    });
    photoInput.value = '';
  });
  recropBtn.addEventListener('click', ()=>{
    if(!rawPhotoFile) return;
    openCropModal(rawPhotoFile, (dataUrl)=>{
      currentPhotoDataUrl = dataUrl;
      root.querySelector('#photoPreview').src = dataUrl;
    });
  });

  root.querySelector('#submitBtn').addEventListener('click', async ()=>{
    const errBox = root.querySelector('#formError');
    errBox.style.display = 'none';
    const husbandName = root.querySelector('#husbandName').value.trim();
    const wifeName = root.querySelector('#wifeName').value.trim();
    const district = root.querySelector('#district').value.trim();
    const message = root.querySelector('#message').value.trim();
    if(!husbandName){ errBox.textContent='남편 이름을 입력해주세요.'; errBox.style.display='block'; return; }
    if(!wifeName){ errBox.textContent='아내 이름을 입력해주세요.'; errBox.style.display='block'; return; }
    if(!district){ errBox.textContent='교구를 입력해주세요.'; errBox.style.display='block'; return; }
    if(!currentPhotoDataUrl){ errBox.textContent='사진을 선택해주세요.'; errBox.style.display='block'; return; }
    if(!message){ errBox.textContent='감사 내용을 적어주세요.'; errBox.style.display='block'; return; }

    const btn = root.querySelector('#submitBtn');
    btn.disabled = true;
    btn.textContent = '수정하는 중...';

    const coupleName = `${husbandName}, ${wifeName} 부부`;
    const updated = { coupleName, husbandName, wifeName, district, message, photo: currentPhotoDataUrl, ts: entry.ts, editCode: entry.editCode };
    try{
      await window.fb.updateEntry(entry._key, updated);
      updated._key = entry._key;
      entryCache[entry._key] = updated;
      mySubmissions.add(entry._key);
      await renderSuccess(root, updated, true);
    }catch(e){
      errBox.textContent = '수정에 실패했어요. 다시 시도해주세요.';
      errBox.style.display = 'block';
      btn.disabled = false;
      btn.textContent = '수정 완료';
    }
  });
}

async function renderScreen(root){
  const submitUrl = location.origin + location.pathname + '#submit';

  root.innerHTML = `
    ${topbar(PROGRAM_TITLE)}
    <div class="screen-header">
      <div class="scripture">
        <div class="verse-stage">
          ${SCRIPTURE_VERSES.map((v,i)=>`<p class="verse${i===0?' active':''}"><span class="vnum">${v.n}</span>${esc(v.text)}</p>`).join('')}
        </div>
        <span class="ref">${esc(SCRIPTURE_REF)}</span>
      </div>
    </div>
    <div class="photowall-wrap" id="wallWrap">
      <div class="flow-wrap" id="flowWrap">
        <div class="flow-track" id="flowTrack">
          <div class="flow-group" id="flowGroupA"></div>
          <div class="flow-group" id="flowGroupB"></div>
        </div>
      </div>
    </div>
    <div id="screenWallHeader" class="screen-header"></div>
    <button class="fab-btn" id="orderStepsFab">진행순서</button>
  `;

  root.querySelector('#orderStepsFab').addEventListener('click', ()=> openOrderStepsModal(submitUrl));

  const verseEls = root.querySelectorAll('.verse-stage .verse');
  if(verseEls.length > 1){
    let verseIdx = 0;
    scriptureTimer = setInterval(()=>{
      verseEls[verseIdx].classList.remove('active');
      verseIdx = (verseIdx + 1) % verseEls.length;
      verseEls[verseIdx].classList.add('active');
    }, 4500);
  }

  const knownTiles = {};
  let flowOffset = 0;

  function drawWall(list){
    list = list.slice().sort((a,b)=>a.ts-b.ts); // 오래된순: 새 사진이 오른쪽 끝에 자연스럽게 추가됨

    const headerEl = document.getElementById('screenWallHeader');
    const groupA = document.getElementById('flowGroupA');
    const groupB = document.getElementById('flowGroupB');
    if(!headerEl || !groupA || !groupB) return;

    if(list.length === 0){
      headerEl.innerHTML = `<div class="eyebrow">아직 도착한 감사가 없어요</div>`;
      groupA.innerHTML = '';
      groupB.innerHTML = '';
      Object.keys(knownTiles).forEach(k=>delete knownTiles[k]);
      return;
    }

    headerEl.innerHTML = `<div class="eyebrow">지금까지 ${list.length}개의 감사가 도착했어요</div>`;

    const seenKeys = new Set();
    let hasNew = false;
    list.forEach(e=>{
      seenKeys.add(e._key);
      const mineClass = mySubmissions.has(e._key) ? ' mine' : '';
      if(!knownTiles[e._key]){
        hasNew = true;
        const tileA = document.createElement('div');
        tileA.className = `flow-tile arrive${mineClass}`;
        tileA.innerHTML = `<img src="${e.photo}" alt="">`;
        tileA.addEventListener('click', ()=>{
          const fresh = entryCache[e._key];
          if(fresh) openModal(fresh);
        });
        const tileB = tileA.cloneNode(true);
        tileB.addEventListener('click', ()=>{
          const fresh = entryCache[e._key];
          if(fresh) openModal(fresh);
        });
        groupA.appendChild(tileA);
        groupB.appendChild(tileB);
        knownTiles[e._key] = [tileA, tileB];
        [tileA, tileB].forEach(t => t.addEventListener('animationend', ()=> t.classList.remove('arrive'), {once:true}));
      } else {
        knownTiles[e._key].forEach(t=>{
          t.className = `flow-tile${mineClass}`;
        });
      }
    });

    if(hasNew){
      triggerSlowdown();
    }

    Object.keys(knownTiles).forEach(k=>{
      if(!seenKeys.has(k)){
        knownTiles[k].forEach(t=>t.remove());
        delete knownTiles[k];
      }
    });
  }

  entriesUnsub = window.fb.subscribeEntries((list)=>{
    entryCache = {};
    list.forEach(e=>{ entryCache[e._key] = e; });
    drawWall(list);
  });

  // 평소엔 빠르게 흐르고, 새 사진이 도착하면 잠시 느려졌다가 다시 빨라짐
  const FLOW_FAST = 130;
  const FLOW_SLOW = 26;
  let flowSpeed = FLOW_FAST;
  let flowTarget = FLOW_FAST;
  let flowSlowUntil = 0;

  function triggerSlowdown(){
    flowTarget = FLOW_SLOW;
    flowSlowUntil = performance.now() + 2200;
  }

  let flowLastTs = null;
  function flowStep(ts){
    const wrapEl = document.getElementById('flowWrap');
    const trackEl = document.getElementById('flowTrack');
    const groupEl = document.getElementById('flowGroupA');
    if(trackEl && groupEl && wrapEl && groupEl.children.length > 0){
      if(flowLastTs !== null){
        const dt = (ts - flowLastTs) / 1000;
        if(ts > flowSlowUntil) flowTarget = FLOW_FAST;
        flowSpeed += (flowTarget - flowSpeed) * Math.min(1, dt * 1.8);
        const groupWidth = groupEl.scrollWidth || 1;
        flowOffset += flowSpeed * dt;
        if(flowOffset >= groupWidth) flowOffset -= groupWidth;
        trackEl.style.transform = `translateX(${-flowOffset}px)`;
      }
      flowLastTs = ts;

      const wrapRect = wrapEl.getBoundingClientRect();
      if(wrapRect.width > 0){
        Object.values(knownTiles).forEach(pair=>{
          pair.forEach(t=>{
            const r = t.getBoundingClientRect();
            const centerX = r.left + r.width / 2 - wrapRect.left;
            const rel = centerX / wrapRect.width; // 0(왼쪽 끝) ~ 1(오른쪽 끝)
            const dist = Math.min(1, Math.abs(rel - 0.5) * 2.1); // 0 중앙, 1 이상 가장자리
            const edge = Math.max(0, dist - 0.25) / 0.75; // 중앙 25%는 완전히 선명
            t.style.filter = `blur(${(edge * 5).toFixed(1)}px)`;
            t.style.opacity = (1 - edge * 0.75).toFixed(2);
          });
        });
      }
    } else {
      flowLastTs = null;
    }
    marqueeRaf = requestAnimationFrame(flowStep);
  }
  marqueeRaf = requestAnimationFrame(flowStep);
}

// ---------- GALLERY VIEW (all rounds combined, instagram-style) ----------
async function renderGallery(root){
  const DISTRICT_OPTIONS = Array.from({length: 12}, (_, i) => `${i+1}교구`);
  let districtFilter = 'all';
  let lastAll = [];

  function draw(all){
    lastAll = all;
    const filtered = districtFilter === 'all' ? all : all.filter(e => e.district === districtFilter);
    const list = filtered.slice().sort((a,b)=>b.ts-a.ts);

    const filterBar = `
      <div class="filter-bar">
        <select id="districtFilterSelect" class="district-select">
          <option value="all">전체 교구</option>
          ${DISTRICT_OPTIONS.map(d=>`<option value="${d}"${districtFilter===d?' selected':''}>${d}</option>`).join('')}
        </select>
      </div>`;

    let body;
    if(list.length === 0){
      body = `<div class="empty-state"><h3>아직 나눔이 없어요</h3><p>가장 먼저 감사를 나눠보세요.</p></div>`;
    } else {
      body = `<div class="grid">` + list.map(e => `
        <div class="tile${mySubmissions.has(e._key) ? ' mine' : ''}" data-key="${e._key}">
          <img src="${e.photo}" alt="">
          <div class="tile-meta">
            <div class="who">${esc(e.coupleName)}${e.district ? ` <span class="district">- ${esc(e.district)}</span>` : ''}</div>
            <div class="preview">${esc(e.message)}</div>
          </div>
        </div>`).join('') + `</div>`;
    }
    root.innerHTML = `${topbar()}
      <h2 class="gallery-title">
        <span>분우 신혼부부 공동체 감사 나눔 노트</span>
        <span class="nav-link" id="goEditBtn" style="font-size:12px;flex-shrink:0;">수정하기</span>
      </h2>
      ${filterBar}
      ${body}`;
    root.querySelector('#goEditBtn').addEventListener('click', ()=> goTo('find'));
    root.querySelector('#districtFilterSelect').addEventListener('change', (ev)=>{
      districtFilter = ev.target.value;
      draw(lastAll);
    });
    root.querySelectorAll('.tile').forEach(t=>{
      t.addEventListener('click', ()=>{
        const e = entryCache[t.dataset.key];
        if(e) openModal(e);
      });
    });
  }
  entriesUnsub = window.fb.subscribeEntries((list)=>{
    entryCache = {};
    list.forEach(e=>{ entryCache[e._key] = e; });
    draw(list);
  });
}

const EVENT_LABEL = '분우-신혼부부-26년 하반기 수련회';

}

// ---------- ADMIN VIEW ----------
const ADMIN_EMAIL = 'astonisher89@gmail.com';

async function renderAdmin(root){
  if(!window.fb.isAdminSignedIn()){
    root.innerHTML = `
      ${topbar()}
      <div class="card">
        <h2 style="margin-bottom:14px;">운영자 로그인</h2>
        <label for="adminPw">비밀번호</label>
        <input type="text" id="adminPw" placeholder="비밀번호 입력">
        <div id="pwErr" class="error-text" style="display:none;">로그인에 실패했어요. 비밀번호를 확인해주세요.</div>
        <button class="btn btn-primary" id="pwBtn">입장하기</button>
      </div>`;
    root.querySelector('#pwBtn').addEventListener('click', async ()=>{
      const pw = root.querySelector('#adminPw').value;
      const errBox = root.querySelector('#pwErr');
      errBox.style.display = 'none';
      try{
        await window.fb.adminLogin(ADMIN_EMAIL, pw);
        renderAdmin(root);
      }catch(e){
        errBox.style.display = 'block';
      }
    });
    return;
  }

  function draw(all){
    const sorted = all.slice().sort((a,b)=>b.ts-a.ts);

    root.innerHTML = `
      ${topbar()}
      <div class="card">
        <h2 style="margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;">
          전체 나눔 관리
          <button class="btn-danger" id="logoutBtn" style="font-weight:400;">로그아웃</button>
        </h2>
        <div class="stat-line">
          <div class="stat-pill">전체 ${all.length}개</div>
        </div>
        <div class="btn-row" style="margin-bottom:18px;">
          <button class="btn btn-secondary" id="downloadPhotosBtn">사진만 다운로드</button>
          <button class="btn btn-secondary" id="downloadCardsBtn">카드 다운로드</button>
        </div>
        <div id="entryList">
          ${sorted.length === 0 ? '<div class="empty-state"><h3>아직 나눔이 없어요</h3></div>' :
            sorted.map(e => `
            <div class="admin-row" data-key="${e._key}">
              <img src="${e.photo}" alt="">
              <div class="info">
                <div class="who">${esc(e.coupleName)}</div>
                <div class="msg">${esc(e.message)}</div>
              </div>
              <button class="btn-danger" data-del="${e._key}">삭제</button>
            </div>`).join('')}
        </div>
      </div>
    `;

    root.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const key = btn.dataset.del;
        if(!confirm('이 나눔을 삭제할까요? 되돌릴 수 없어요.')) return;
        try{
          await window.fb.deleteEntry(key);
          delete entryCache[key];
          showToast('삭제했어요.');
        }catch(e){
          showToast('삭제에 실패했어요. 다시 시도해주세요.');
        }
      });
    });

    const photosBtn = root.querySelector('#downloadPhotosBtn');
    if(photosBtn) photosBtn.addEventListener('click', async ()=>{
      photosBtn.disabled = true;
      const orig = photosBtn.textContent;
      photosBtn.textContent = '압축하는 중...';
      await downloadAllPhotos();
      photosBtn.disabled = false;
      photosBtn.textContent = orig;
    });

    const cardsBtn = root.querySelector('#downloadCardsBtn');
    if(cardsBtn) cardsBtn.addEventListener('click', async ()=>{
      cardsBtn.disabled = true;
      const orig = cardsBtn.textContent;
      cardsBtn.textContent = '카드 만드는 중...';
      await downloadAllCards();
      cardsBtn.disabled = false;
      cardsBtn.textContent = orig;
    });

    const logoutBtn = root.querySelector('#logoutBtn');
    if(logoutBtn) logoutBtn.addEventListener('click', async ()=>{
      await window.fb.adminLogout();
      renderAdmin(root);
    });
  }

  entriesUnsub = window.fb.subscribeEntries((list)=>{
    entryCache = {};
    list.forEach(e=>{ entryCache[e._key] = e; });
    draw(list);
  });
}

function bootApp(){
  if(window.fb){ render(); }
  else{ window.addEventListener('fbready', render, { once: true }); }
}
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', bootApp);
} else {
  bootApp();
}
</script>
